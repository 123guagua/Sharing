<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEO 小工具</title><style>
body{font-family:Arial,"Microsoft YaHei";margin:0;background:#f6f7fb;color:#222}.wrap{max-width:900px;margin:auto;padding:30px 20px}.back{color:#6c5ce7;text-decoration:none}h1{color:#6c5ce7}.row{margin:15px 0}.row label{display:block;font-weight:bold;margin-bottom:6px}.row input,.row textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.row textarea{height:110px}.count{font-size:13px;color:#6b7280}.preview{background:#fff;padding:20px;border-radius:12px;margin-top:20px}.title{color:#1a0dab;font-size:20px}.url{color:#188038}.desc{color:#4d5156;margin-top:8px;line-height:1.5}button{background:#6c5ce7;color:#fff;border:0;border-radius:8px;padding:11px 18px;margin-top:10px;cursor:pointer}</style></head><body><div class="wrap"><a class="back" href="../">← 返回工具箱</a><h1>🔎 SEO 小工具</h1><div class="row"><label>SEO Title</label><input id="title" maxlength="70" oninput="update()"><div class="count" id="tc">0 字符</div></div><div class="row"><label>Meta Description</label><textarea id="desc" maxlength="180" oninput="update()"></textarea><div class="count" id="dc">0 字符</div></div><div class="row"><label>页面 URL</label><input id="url" placeholder="https://example.com/" oninput="update()"></div><button onclick="clearAll()">清空</button><div class="preview"><div class="title" id="pt">SEO Title 预览</div><div class="url" id="pu">https://example.com/</div><div class="desc" id="pd">Meta Description 预览</div></div></div><script>const $=id=>document.getElementById(id);function update(){$('tc').textContent=$('title').value.length+' 字符';$('dc').textContent=$('desc').value.length+' 字符';$('pt').textContent=$('title').value||'SEO Title 预览';$('pu').textContent=$('url').value||'https://example.com/';$('pd').textContent=$('desc').value||'Meta Description 预览'}function clearAll(){$('title').value='';$('desc').value='';$('url').value='';update()}</script></body></html>
