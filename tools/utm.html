<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UTM 链接生成器</title><style>
body{font-family:Arial,"Microsoft YaHei";margin:0;background:#f6f7fb;color:#222}.wrap{max-width:900px;margin:auto;padding:30px 20px}.back{color:#6c5ce7;text-decoration:none}h1{color:#6c5ce7}.row{margin:12px 0}.row label{display:block;font-weight:bold;margin-bottom:6px}.row input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{background:#6c5ce7;color:#fff;border:0;border-radius:8px;padding:11px 18px;margin:10px 8px 10px 0;cursor:pointer}.out{background:#fff;padding:15px;border-radius:10px;word-break:break-all}</style></head><body><div class="wrap"><a class="back" href="../">← 返回工具箱</a><h1>📊 UTM 链接生成器</h1><div class="row"><label>网站 URL *</label><input id="url" placeholder="https://example.com/page"></div><div class="row"><label>utm_source</label><input id="source" placeholder="google"></div><div class="row"><label>utm_medium</label><input id="medium" placeholder="cpc"></div><div class="row"><label>utm_campaign</label><input id="campaign" placeholder="summer_sale"></div><div class="row"><label>utm_term</label><input id="term" placeholder="keyword"></div><div class="row"><label>utm_content</label><input id="content" placeholder="ad_01"></div><button onclick="build()">生成链接</button><button onclick="copy()">复制</button><div id="out" class="out">生成后的链接会显示在这里</div></div><script>function build(){try{const u=new URL(document.getElementById('url').value);[['source','utm_source'],['medium','utm_medium'],['campaign','utm_campaign'],['term','utm_term'],['content','utm_content']].forEach(([a,k])=>{const v=document.getElementById(a).value.trim();if(v)u.searchParams.set(k,v)});document.getElementById('out').textContent=u.href}catch(e){alert('请输入有效的网站 URL')}}async function copy(){const t=document.getElementById('out').textContent;if(t.startsWith('生成'))return;await navigator.clipboard.writeText(t);alert('已复制')}</script></body></html>
