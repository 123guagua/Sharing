<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Socks5 批量转二维码工具</title>
<style>body{font-family:Arial,"Microsoft YaHei",sans-serif;margin:0;background:#f6f7fb;color:#222}.wrap{max-width:1000px;margin:auto;padding:30px 20px 60px}.back{display:inline-block;margin-bottom:20px;color:#6c5ce7;text-decoration:none}h1{text-align:center;color:#6c5ce7}textarea{width:100%;height:220px;padding:12px;border:1px solid #ddd;border-radius:10px;resize:vertical;font-size:14px}button{background:#6c5ce7;color:#fff;padding:11px 20px;border:0;border-radius:8px;cursor:pointer;margin:10px 8px 10px 0}.proxy-block{display:flex;gap:20px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;margin:15px 0}.proxy-text{flex:1;white-space:pre-line;line-height:1.8}.proxy-qr{flex:1;text-align:center}img{margin-top:10px}@media(max-width:600px){.proxy-block{flex-direction:column}.proxy-qr{flex:auto}}</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script></head>
<body><div class="wrap"><a class="back" href="../">← 返回工具箱</a><h1>Socks5 批量转二维码工具</h1><p>支持格式：host:port:username:password 或 socks5://username:password@host:port</p>
<textarea id="proxyList" placeholder="每行一个代理，例如：&#10;192.204.93.135:7778:4ugvhvko6ou942:idzlar"></textarea><br><button onclick="makeQR()">批量生成二维码</button><button onclick="exportExcel()">导出为 Excel</button><div id="result"></div></div>
<script>
let exportData=[];function makeQR(){const v=document.getElementById("proxyList").value.trim(),lines=v?v.split("\n"):[],r=document.getElementById("result");r.innerHTML="";exportData=[];lines.forEach(line=>{let text=line.trim();if(!text)return;let type="socks5",host="",port="",user="",pass="",uri="";if(text.startsWith("socks5://")){const m=text.match(/^socks5:\/\/(.+?):(.+?)@(.+?):(\d+)$/);if(m){user=m[1];pass=m[2];host=m[3];port=m[4];uri=text}}else{const p=text.split(":");if(p.length===4){host=p[0];port=p[1];user=p[2];pass=p[3];uri=`socks5://${user}:${pass}@${host}:${port}`}}const info=`代理类型: ${type}\n代理主机: ${host}\n代理端口: ${port}\n账号: ${user}\n密码: ${pass}`,b=document.createElement("div");b.className="proxy-block";const i=document.createElement("div");i.className="proxy-text";i.textContent=info;const q=document.createElement("div");q.className="proxy-qr";if(uri)QRCode.toDataURL(uri,{width:160},(e,u)=>{if(!e){const img=document.createElement("img");img.src=u;q.appendChild(img);exportData.push({info,qrcode:u})}});b.appendChild(i);b.appendChild(q);r.appendChild(b)})}
async function exportExcel(){if(!exportData.length){alert("请先生成二维码！");return}const w=new ExcelJS.Workbook(),s=w.addWorksheet("Proxies");s.columns=[{header:"代理信息",width:40},{header:"二维码",width:30}];exportData.forEach(x=>{const row=s.addRow([x.info,""]),id=w.addImage({base64:x.qrcode,extension:"png"});s.addImage(id,{tl:{col:1,row:row.number-1},ext:{width:150,height:150}})});const buffer=await w.xlsx.writeBuffer(),blob=new Blob([buffer],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="socks5_proxies.xlsx";a.click()}
</script></body></html>
