<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文本工具</title><style>
body{font-family:Arial,"Microsoft YaHei";margin:0;background:#f6f7fb;color:#222}.wrap{max-width:950px;margin:auto;padding:30px 20px}.back{color:#6c5ce7;text-decoration:none}h1{color:#6c5ce7}textarea{width:100%;height:300px;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;font-size:14px}button{background:#6c5ce7;color:#fff;border:0;border-radius:8px;padding:10px 16px;margin:10px 8px 10px 0;cursor:pointer}.stats{color:#6b7280;font-size:14px}</style></head><body><div class="wrap"><a class="back" href="../">← 返回工具箱</a><h1>📝 文本工具</h1><textarea id="txt" placeholder="每行一条内容"></textarea><div class="stats" id="stats">字符：0　行数：0</div><button onclick="dedupe()">去重</button><button onclick="sortLines()">升序排序</button><button onclick="sortDesc()">降序排序</button><button onclick="trimLines()">去空格</button><button onclick="copy()">复制</button><button onclick="clearAll()">清空</button></div><script>const t=document.getElementById('txt'),st=document.getElementById('stats');t.addEventListener('input',stats);function lines(){return t.value.split(/\r?\n/)}function set(a){t.value=a.join('\n');stats()}function dedupe(){set([...new Set(lines())])}function sortLines(){set(lines().sort((a,b)=>a.localeCompare(b,'zh-CN')))}function sortDesc(){set(lines().sort((a,b)=>b.localeCompare(a,'zh-CN')))}function trimLines(){set(lines().map(x=>x.trim()))}function stats(){const a=lines();st.textContent='字符：'+t.value.length+'　行数：'+(t.value?t.value.split(/\r?\n/).length:0)+'　非空行：'+a.filter(x=>x.trim()).length}async function copy(){await navigator.clipboard.writeText(t.value);alert('已复制')}function clearAll(){t.value='';stats()}</script></body></html>
