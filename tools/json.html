<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON 格式化</title><style>
body{font-family:Arial,"Microsoft YaHei";margin:0;background:#f6f7fb;color:#222}.wrap{max-width:1000px;margin:auto;padding:30px 20px}.back{color:#6c5ce7;text-decoration:none}h1{color:#6c5ce7}.box{width:100%;height:420px;padding:14px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;font:14px Consolas,monospace}button{background:#6c5ce7;color:#fff;border:0;border-radius:8px;padding:11px 18px;margin:10px 8px 10px 0;cursor:pointer}#status{font-size:14px}</style></head><body><div class="wrap"><a class="back" href="../">← 返回工具箱</a><h1>📋 JSON 格式化</h1><textarea id="box" class="box" placeholder='例如：{"name":"Tom","age":18}'></textarea><br><button onclick="formatJSON()">格式化</button><button onclick="minify()">压缩</button><button onclick="copy()">复制</button><button onclick="clearBox()">清空</button><span id="status"></span></div><script>const b=document.getElementById('box'),s=document.getElementById('status');function parse(){return JSON.parse(b.value)}function formatJSON(){try{b.value=JSON.stringify(parse(),null,2);s.textContent=' ✓ JSON 有效'}catch(e){s.textContent=' ✗ JSON 无效：'+e.message}}function minify(){try{b.value=JSON.stringify(parse());s.textContent=' ✓ 已压缩'}catch(e){s.textContent=' ✗ JSON 无效'}}async function copy(){await navigator.clipboard.writeText(b.value);s.textContent=' ✓ 已复制'}function clearBox(){b.value='';s.textContent=''}</script></body></html>
