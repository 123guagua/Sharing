<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL 编码 / 解码</title><style>
body{font-family:Arial,"Microsoft YaHei";margin:0;background:#f6f7fb;color:#222}.wrap{max-width:900px;margin:auto;padding:30px 20px}.back{color:#6c5ce7;text-decoration:none}h1{color:#6c5ce7}textarea{width:100%;height:260px;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{background:#6c5ce7;color:#fff;border:0;border-radius:8px;padding:11px 18px;margin:10px 8px 10px 0;cursor:pointer}</style></head><body><div class="wrap"><a class="back" href="../">← 返回工具箱</a><h1>🔗 URL 编码 / 解码</h1><textarea id="input" placeholder="输入 URL 或需要编码的文本"></textarea><br><button onclick="enc()">URL 编码</button><button onclick="dec()">URL 解码</button><button onclick="copy()">复制结果</button><button onclick="clearAll()">清空</button></div><script>const i=document.getElementById('input');function enc(){i.value=encodeURIComponent(i.value)}function dec(){try{i.value=decodeURIComponent(i.value)}catch(e){alert('解码失败：内容不是有效的 URL 编码')}}async function copy(){await navigator.clipboard.writeText(i.value);alert('已复制')}function clearAll(){i.value=''}</script></body></html>
